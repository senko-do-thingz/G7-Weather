name: G7 Weather Service CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [ 17 ]

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up JDK
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      # 3. Build project (skip tests in build phase)
      - name: Build with Maven
        run: mvn compile -B --no-transfer-progress

      # 4. Run unit tests
      - name: Run Unit Tests
        run: mvn test -B --no-transfer-progress

      # 5. Generate Surefire test report
      - name: Generate Test Report
        if: always()
        run: mvn surefire-report:report-only -B --no-transfer-progress

      # 6. Upload test results as artifact
      - name: Upload Test Results (XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-jdk${{ matrix.java-version }}
          path: target/surefire-reports/
          retention-days: 30

      # 7. Upload HTML test report as artifact
      - name: Upload Test Report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-html-jdk${{ matrix.java-version }}
          path: target/site/surefire-report.html
          retention-days: 30

      # 8. Publish test summary to GitHub Actions
      - name: Test Report Summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit Test Results (JDK ${{ matrix.java-version }})
          path: target/surefire-reports/TEST-*.xml
          reporter: java-junit

      # 9. Package JAR
      - name: Package JAR
        run: mvn package -DskipTests -B --no-transfer-progress

      # 10. Upload built JAR
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: weather-service-jar-jdk${{ matrix.java-version }}
          path: target/weather-service-*.jar
          retention-days: 30

  # Code quality checks (optional but recommended)
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Verify
        run: mvn verify -B --no-transfer-progress
